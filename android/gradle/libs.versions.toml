[versions]
# 빌드 툴 (사용자 확정 #17 — archive 와 동일 라인)
agp = "8.13.2"
kotlin = "2.1.20"
ksp = "2.1.20-2.0.1"
hilt = "2.56.2"

# AndroidX / Compose
coreKtx = "1.15.0"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2025.01.00"
# navigation-compose 는 Compose BOM 비관리(독립 버전) — 명시 핀 필요. Compose 1.7.x 계열 호환 안정판.
navigationCompose = "2.8.5"
# hilt-navigation-compose 는 Hilt/Compose BOM 비관리(androidx.hilt 독립 버전) — hiltViewModel() 진입점(M3-01).
hiltNavigationCompose = "1.2.0"
# androidx.hilt — hilt-work(@HiltWorker WorkerFactory) + 그 KSP 컴파일러(dagger hilt-compiler 와 별개). M3-07.
androidxHilt = "1.2.0"
# WorkManager — 로컬 리마인더 자기재예약 OneTime 체인(M3-07). 부팅 후 영속 작업 자동 재enqueue(2.1+).
work = "2.10.0"

# 네트워크 / 직렬화 / 비동기 / 저장 (M1-05)
coroutines = "1.9.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
kotlinxSerialization = "1.7.3"
retrofitKotlinxConverter = "1.0.0"
datastore = "1.1.1"

# Firebase (BoM 이 아티팩트 버전을 관리 — 아래 firebase-* 라이브러리는 무버전)
firebaseBom = "34.9.0"
googleServices = "4.4.4"

# 정적 분석
detekt = "1.23.8"
ktlint = "12.1.1"

# 테스트
junit = "4.13.2"
androidxJunit = "1.2.1"
espressoCore = "3.6.1"
# Robolectric — 권한 SDK 분기(13+/이하) + WorkManager TestListenableWorkerBuilder JVM 검증(M3-07).
robolectric = "4.14.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
# @HiltWorker 통합: hilt-work(런타임 HiltWorkerFactory) + hilt-compiler(KSP, dagger 컴파일러와 별개). M3-07.
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHilt" }

# WorkManager(M3-07) — 로컬 리마인더 스케줄링 + work-testing(TestListenableWorkerBuilder).
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }

# 네트워크 / 직렬화 / 비동기 / 저장 (M1-05)
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# Firebase Task<T> ↔ coroutine 브릿지(.await()). 게스트 익명 로그인·ID 토큰 대기(M3-01).
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization-converter = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxConverter" }
okhttp-bom = { group = "com.squareup.okhttp3", name = "okhttp-bom", version.ref = "okhttp" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor" }
# okhttp-sse: 명명 SSE 이벤트(event: meta/object/done/error) 파싱 — 대본 생성 스트림(M1-01). BOM 관리(무버전).
okhttp-sse = { group = "com.squareup.okhttp3", name = "okhttp-sse" }
# mockwebserver: SSE 프레이밍 골든 테스트(M1-01, NFR 위험지대). BOM 관리(무버전).
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Firebase — BoM platform + 무버전 아티팩트(analytics/auth/firestore). FCM 은 v1.1 범위라 제외(PRD §10.2).
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
