name: Firestore Rules

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  rules-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Firestore 에뮬레이터는 JAR(JVM)로 구동된다 — android-ci.yml 과 동일 temurin/17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install firestore-tests deps
        run: npm --prefix firestore-tests ci

      # emulators:exec 가 FIRESTORE_EMULATOR_HOST 를 자식 프로세스에 주입 → rules.test.ts 가 읽는다.
      # firebase-tools 는 firestore-tests devDependency 라 로컬 .bin 으로 해결(전역 설치 불필요).
      # cwd=리포 루트라 firebase.json(firestore 블록 포함)을 그대로 사용한다.
      # CI 는 규칙 테스트만 실행 — TTL(gcloud)은 자격증명이 필요하므로 운영자 수동 스텝(scripts/firestore-ttl.sh).
      - name: Run rules unit tests on the Firestore emulator
        run: firestore-tests/node_modules/.bin/firebase emulators:exec --only firestore "npm --prefix firestore-tests test"
