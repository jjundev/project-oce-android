name: Functions

on:
  push:
    branches: [ master ]
    paths: [ 'functions/**', '.github/workflows/functions.yml' ]
  pull_request:
    paths: [ 'functions/**', '.github/workflows/functions.yml' ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
