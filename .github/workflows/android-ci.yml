name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      # A3: 유닛 테스트(testDebugUnitTest)를 게이트에 포함해 src/test 예시 테스트가 실제로 실행되게 한다.
      # 계측 테스트(androidTest)는 에뮬레이터가 필요하므로 CI 게이트에서 제외(로컬 스모크).
      - name: Assemble, unit test, lint, static analysis
        run: ./gradlew assembleDebug testDebugUnitTest lint detekt ktlintCheck
